name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # repository ยังไม่มี application code จนกว่า Slice 1 จะส่งมอบ
      # job นี้ต้อง skip อย่างชัดเจน ไม่ใช่ผ่านแบบเงียบ ซึ่งจะอ่านผิดเป็น "test ผ่าน"
      - name: Detect application code
        id: detect
        run: |
          if [ ! -f package.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่มี application code — ข้าม typecheck, lint และ test"
            echo "ผลของ job นี้ไม่ได้แปลว่า test ผ่าน แต่แปลว่ายังไม่มี test ให้รัน"
            exit 0
          fi
          # .nvmrc เป็นไฟล์ root ที่ Active Lane ของ Slice 1 เป็นเจ้าของตาม issue #4
          # งาน CI สร้างเองไม่ได้ จึงต้องแจ้งให้ชัดแทนที่จะปล่อยให้ setup-node fail แบบอ่านไม่ออก
          if [ ! -f .nvmrc ]; then
            echo "::error::มี package.json แล้วแต่ไม่มี .nvmrc — Slice 1 ต้องเพิ่มไฟล์นี้เพื่อกำหนด Node version ที่ใช้จริง"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm run lint

      # integration test ต้องใช้ PostgreSQL จริงเพราะ AC-29 บังคับให้ทดสอบ
      # composite foreign key และ unique constraint ที่ระดับ database
      # ซึ่ง in-memory fake ทดสอบแทนไม่ได้
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/kdc_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect application code
        id: detect
        run: |
          if [ ! -f package.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่มี application code — ข้าม E2E"
            exit 0
          fi
          if [ ! -f .nvmrc ]; then
            echo "::error::มี package.json แล้วแต่ไม่มี .nvmrc"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        if: steps.detect.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # AC-25 และ AC-33 บังคับให้ทดสอบ critical flow บนสาม viewport
      - name: E2E
        if: steps.detect.outputs.present == 'true'
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/kdc_e2e

      # evidence ตาม AC-37 ต้องมี trace และ screenshot ที่อ้างอิงได้
      - name: Upload traces
        if: steps.detect.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            **/playwright-report/**
            **/test-results/**
          retention-days: 14
          if-no-files-found: ignore

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kdc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
